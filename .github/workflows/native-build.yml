name: Native Windows pipeline

on:
  workflow_call:
    inputs:
      use-cache:
        type: boolean
        required: true
      save-cache:
        type: boolean
        default: false
      release:
        type: boolean
        default: false

# Cache access is capped by the caller: read for PRs/manual builds, write
# for main pushes, none for tags. Do not override that boundary here.
permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust tests and lint
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.release && '0' || '1' }}

      - name: Check versions and release ancestry
        run: |
          $csproj = [xml](Get-Content src-windows/Reminders.WinUI/Reminders.WinUI.csproj)
          $app = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }).Trim()
          $cargo = (Select-String -Path sidecar/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($app -ne $cargo) { throw "Version mismatch: csproj is $app but Cargo.toml is $cargo." }
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            if ($tag -ne $app) { throw "Tag version does not match app version $app." }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main.' }
          }
          Write-Host "Version $app is consistent."

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy

      - name: Restore Rust check dependencies
        if: inputs.use-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: ci-v1-rust
          key: checks-x64-debug
          workspaces: sidecar -> target
          cache-bin: false
          save-if: ${{ inputs.save-cache && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Tests and clippy share the debug dependencies. Release builds run in
      # parallel in their own architecture-specific jobs.
      - name: Test Rust backend
        run: cargo test --locked --manifest-path sidecar/Cargo.toml

      - name: Lint Rust backend
        run: cargo clippy --locked --all-targets --manifest-path sidecar/Cargo.toml -- -D warnings

  audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check cache and release trust boundaries
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r scripts/ci-policy-requirements.txt
          python scripts/test_ci_policy.py

      # No tool/advisory cache: verify the fixed upstream archive before
      # extraction, invoke it directly, and fetch current advisories every run.
      - name: Install verified cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz \
            --output "$archive"
          printf '%s  %s\n' '7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428' "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-audit"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/cargo-audit"

      - name: Audit lockfile against current advisories
        shell: bash
        run: '"$RUNNER_TEMP/cargo-audit/cargo-audit" audit --file sidecar/Cargo.lock'

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            artifact: x64
            rust_target: x86_64-pc-windows-msvc
            portable_dir: dist-windows
          - architecture: ARM64
            artifact: arm64
            rust_target: aarch64-pc-windows-msvc
            portable_dir: dist-windows-arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: ${{ matrix.rust_target }}

      # PRs inherit read-only cache tokens; only pushes to main may save.
      # New namespaces retire the old mixed-architecture caches.
      - name: Restore Rust build dependencies
        if: inputs.use-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: ci-v1-rust
          key: package-${{ matrix.rust_target }}
          workspaces: sidecar -> target
          cache-bin: false
          save-if: ${{ inputs.save-cache && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Restore NuGet packages
        if: inputs.use-cache
        id: nuget
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .nuget/packages
          key: ci-v1-nuget-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles(format('src-windows/Reminders.WinUI/packages.{0}.lock.json', matrix.architecture == 'ARM64' && 'win-arm64' || 'win-x64'), 'src-windows/Reminders.WinUI/Reminders.WinUI.csproj') }}

      - name: Build Rust backend
        run: .\scripts\build-sidecar.ps1 -Architecture ${{ matrix.architecture }}

      - name: Build and publish native app
        run: .\scripts\build-windows.ps1 -Configuration Release -Architecture ${{ matrix.architecture }} -SkipSidecar -LockedRestore

      - name: Test update release selection and download verification
        run: dotnet run --project src-windows/AppUpdater.Tests/AppUpdater.Tests.csproj -c Release

      - name: Save NuGet packages from main
        if: inputs.save-cache && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}

      - name: Build unsigned MSIX
        run: .\scripts\build-msix.ps1 -Architecture ${{ matrix.architecture }} -SkipBuild

      # The .exe installer is the artifact users can actually install. An
      # unsigned MSIX is refused outright by Windows -- the Install button is
      # disabled -- whereas an unsigned .exe only draws a SmartScreen warning
      # the user can dismiss. The MSIX is kept for a future signed or Store
      # release.
      - name: Install Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          else {
            Write-Host 'Inno Setup is already present on the runner.'
          }

      - name: Build installer
        run: .\scripts\build-installer.ps1 -Architecture ${{ matrix.architecture }} -SkipBuild

      - name: Verify published artifacts
        run: |
          $arch = "${{ matrix.architecture }}"
          $lower = if ($arch -eq 'ARM64') { 'arm64' } else { 'x64' }
          $expected = @(
            "${{ matrix.portable_dir }}/Reminders.exe",
            "${{ matrix.portable_dir }}/reminders-sidecar.exe",
            "dist-msix/Reminders-for-Windows-$arch.msix",
            "dist-installer/Reminders-for-Windows-$lower-Setup.exe"
          )
          foreach ($path in $expected) {
            $item = Get-Item -LiteralPath $path -ErrorAction Stop
            if ($item.Length -eq 0) { throw "Published artifact is empty: $path" }
            Write-Host ("{0,-64} {1,10:N0} bytes" -f $item.Name, $item.Length)
          }

      - name: Package portable build
        run: Compress-Archive -Path "${{ matrix.portable_dir }}/*" -DestinationPath "Reminders-for-Windows-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Reminders-for-Windows-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            dist-installer/Reminders-for-Windows-${{ matrix.artifact }}-Setup.exe
            Reminders-for-Windows-${{ matrix.artifact }}.zip
            dist-msix/Reminders-for-Windows-${{ matrix.architecture }}.msix
          if-no-files-found: error
          compression-level: 0
