name: Native Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# Static token limits, rather than only a cache action's save-if, enforce the
# trust boundary even if repository code tries to use the cache API directly.
cache-mode: read

jobs:
  ci:
    if: github.event_name != 'push'
    cache-mode: read
    uses: ./.github/workflows/native-build.yml
    with:
      use-cache: true

  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    cache-mode: write
    uses: ./.github/workflows/native-build.yml
    with:
      use-cache: true
      save-cache: true

  tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    cache-mode: none
    uses: ./.github/workflows/native-build.yml
    with:
      use-cache: false
      release: true

  # Tagging v* publishes a draft release carrying both architectures. It is
  # left as a draft on purpose: the MSIX is unsigned, so a human has to decide
  # what to say about sideloading before anyone can install it. This replaces
  # the tag-release path that shipped with the Tauri bundle. The native updater
  # sees a release only after the draft is published as a stable release.
  release:
    name: Draft release
    cache-mode: none
    needs: tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: Reminders-for-Windows-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true

      - name: Check both architectures are present
        run: |
          set -euo pipefail
          for file in \
            "Reminders-for-Windows-x64-Setup.exe" \
            "Reminders-for-Windows-arm64-Setup.exe" \
            "Reminders-for-Windows-x64.zip" \
            "Reminders-for-Windows-arm64.zip" \
            "Reminders-for-Windows-x64.msix" \
            "Reminders-for-Windows-ARM64.msix"; do
            found=$(find artifacts -name "$file" -size +0c | head -1)
            if [ -z "$found" ]; then
              echo "Missing or empty artifact: $file" >&2
              exit 1
            fi
          done

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*-Setup.exe
            artifacts/**/*.zip
            artifacts/**/*.msix
          fail_on_unmatched_files: true
          body: |
            ## Before you sign in: two-factor works by text only

            When Apple asks for a verification code, use **Text me a code** and
            enter the code from the SMS. The six digits shown in the prompt on
            your iPhone, iPad or Mac **will not be accepted** -- Apple verifies
            those through a channel this app does not implement yet, and it
            keeps displaying the prompt regardless, so a device code looks
            correct and is refused every time.

            If your Apple ID has **no trusted phone number**, sign-in cannot
            complete at all in this release. Add a number at
            [appleid.apple.com](https://appleid.apple.com) first.

            ## Installing

            Download **Reminders-for-Windows-x64-Setup.exe** (or `arm64` on an
            Arm device) and run it. It installs for the current user, so there
            is no admin prompt.

            These builds are not code-signed, so Windows SmartScreen will warn
            the first time. Choose **More info**, then **Run anyway**.

            Prefer not to install? `Reminders-for-Windows-x64.zip` is the same
            application as a portable folder -- unzip it and run `Reminders.exe`.
            Keep the publish folder together, including `Reminders.Core.dll`.

            The `.msix` is for a future signed or Microsoft Store release.
            Windows will not install it while it is unsigned.
